<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login Page</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(to right, #667eea, #764ba2);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
    }
    .login-card {
      background: rgba(0, 0, 0, 0.7);
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      width: 100%;
      max-width: 400px;
    }
    .form-control {
      background-color: #2c2c2c;
      color: white;
      border: none;
    }
    .form-control:focus {
      background-color: #2c2c2c;
      color: white;
    }
    .password-wrapper {
      position: relative;
    }
    .password-wrapper input {
      padding-right: 40px;
    }
    .toggle-password {
      position: absolute;
      top: 50%;
      right: 10px;
      transform: translateY(-50%);
      cursor: pointer;
      color: #ccc;
    }
    .google-btn {
      background: white;
      color: #444;
    }
    .toggle-password svg {
      width: 20px;
      height: 20px;
      fill: #ccc;
    }
  </style>
</head>
<body>
  <div class="login-card text-center">
    <h2 class="mb-4">🔐 Login</h2>
    <form id="loginForm">
      <div class="mb-3 text-start">
        <label for="username" class="form-label">Username</label>
        <input type="text" class="form-control" id="username" placeholder="Enter username" required />
      </div>

      <div class="mb-3 text-start password-wrapper">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password" placeholder="Enter password" required />
        <div class="toggle-password" id="togglePassword">
          <!-- Eye Icon SVG -->
          <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" fill="currentColor" class="bi bi-eye" viewBox="0 0 16 16">
            <path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8M1.173 8a13 13 0 0 1 
              1.66-2.043C4.12 4.668 5.88 3.5 8 3.5s3.879 
              1.168 5.168 2.457A13 13 0 0 1 
              14.828 8q-.086.13-.195.288c-.335.48-.83 
              1.12-1.465 1.755C11.879 11.332 10.119 
              12.5 8 12.5s-3.879-1.168-5.168-2.457A13 
              13 0 0 1 1.172 8z"/>
            <path d="M8 5.5a2.5 2.5 0 1 0 0 5 
              2.5 2.5 0 0 0 0-5M4.5 8a3.5 3.5 0 1 1 7 0 
              3.5 3.5 0 0 1-7 0"/>
          </svg>
        </div>
      </div>

      <div class="d-grid mb-3">
        <button type="submit" class="btn btn-primary">Login</button>
      </div>
      <div class="d-grid mb-2">
        <button type="button" class="btn google-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-google" viewBox="0 0 16 16">
                <path d="M15.545 6.558a9.4 9.4 0 0 1 .139 1.626c0 2.434-.87 4.492-2.384 5.885h.002C11.978 15.292 10.158 16 8 16A8 8 0 1 1 8 0a7.7 7.7 0 0 1 5.352 2.082l-2.284 2.284A4.35 4.35 0 0 0 8 3.166c-2.087 0-3.86 1.408-4.492 3.304a4.8 4.8 0 0 0 0 3.063h.003c.635 1.893 2.405 3.301 4.492 3.301 1.078 0 2.004-.276 2.722-.764h-.003a3.7 3.7 0 0 0 1.599-2.431H8v-3.08z"/>
              </svg>
          Sign in with Google
        </button>
      </div>
    </form>
    <p id="loginMessage" class="mt-3"></p>
  </div>

  <script>
  const passwordInput = document.getElementById("password");

  // Login logic
  const form = document.getElementById("loginForm");
  const message = document.getElementById("loginMessage");

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    const username = document.getElementById("username").value.trim();
    const password = passwordInput.value.trim();

    const validUser = "testuser";
    const validPass = "password123";

    if (username === validUser && password === validPass) {
      message.textContent = "✅ Login successful!";
      message.style.color = "limegreen";

      // Save to localStorage so dashboard can access it
      const user = {
        name: username,
        picture: "https://via.placeholder.com/50" // or a real pic URL if needed
      };
      localStorage.setItem("user", JSON.stringify(user));

      setTimeout(() => {
        window.location.href = "dashboard.html";
      }, 1000);
    } else {
      message.textContent = "❌ Invalid username or password!";
      message.style.color = "red";
    }
  });
</script>

</body>
</html>
