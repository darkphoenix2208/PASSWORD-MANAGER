<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://kit.fontawesome.com/a2e0c42f6d.js" crossorigin="anonymous"></script>
    <style>
        body {
            background: linear-gradient(135deg, #1f1c2c, #928dab);
            color: #f0f0f0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', sans-serif;
        }
        #strength.weak {
    color: red;
}
#strength.fair {
    color: orange;
}
#strength.good {
    color: gold;
}
#strength.strong {
    color: green;
}
#strength.very-strong {
    color: lime;
}


        .card {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            border: none;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 500px;
        }

        .form-check-label {
            margin-left: 0.5rem;
        }

        .output-group {
            display: flex;
            gap: 10px;
        }

        #strength {
            font-weight: bold;
            text-transform: uppercase;
        }

        #history {
            font-size: 0.9rem;
            margin-top: 10px;
            color: #ccc;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
        }

        .form-control:disabled {
            background-color: #2c2c2c;
            color: white;
        }
    </style>
</head>

<body>
    <div class="card">
        <h2 class="text-center mb-3">🔐 Password Generator</h2>

        <div class="mb-3">
            <label for="length" class="form-label">Password Length</label>
            <input type="number" id="length" class="form-control" value="12" min="4" max="50">
        </div>

        <div class="form-check mb-1">
            <input class="form-check-input" type="checkbox" id="uppercase" checked>
            <label class="form-check-label" for="uppercase">Include Uppercase</label>
        </div>
        <div class="form-check mb-1">
            <input class="form-check-input" type="checkbox" id="lowercase" checked>
            <label class="form-check-label" for="lowercase">Include Lowercase</label>
        </div>
        <div class="form-check mb-1">
            <input class="form-check-input" type="checkbox" id="numbers" checked>
            <label class="form-check-label" for="numbers">Include Numbers</label>
        </div>
        <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="symbols" checked>
            <label class="form-check-label" for="symbols">Include Symbols</label>
        </div>

        <div class="output-group mb-3">
            <input type="password" id="password" class="form-control" readonly>
            <button class="btn btn-outline-light" id="toggle"><svg xmlns="http://www.w3.org/2000/svg" width="16"
                    height="16" fill="currentColor" class="bi bi-eye" viewBox="0 0 16 16">
                    <path
                        d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8M1.173 8a13 13 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5s3.879 1.168 5.168 2.457A13 13 0 0 1 14.828 8q-.086.13-.195.288c-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.119 12.5 8 12.5s-3.879-1.168-5.168-2.457A13 13 0 0 1 1.172 8z" />
                    <path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5M4.5 8a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0" />
                </svg></button>
            <button class="btn btn-outline-success" id="copy"> <svg xmlns="http://www.w3.org/2000/svg" width="16"
                    height="16" fill="currentColor" class="bi bi-clipboard" viewBox="0 0 16 16">
                    <path
                        d="M4 1.5H3a2 2 0 0 0-2 2V14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V3.5a2 2 0 0 0-2-2h-1v1h1a1 1 0 0 1 1 1V14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V3.5a1 1 0 0 1 1-1h1z" />
                    <path
                        d="M9.5 1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-3a.5.5 0 0 1-.5-.5v-1a.5.5 0 0 1 .5-.5zm-3-1A1.5 1.5 0 0 0 5 1.5v1A1.5 1.5 0 0 0 6.5 4h3A1.5 1.5 0 0 0 11 2.5v-1A1.5 1.5 0 0 0 9.5 0z" />
                </svg></button>
        </div>

        <p>Password Strength: <span id="strength">-</span></p>

        <div class="mb-3">
            <label for="app-name" class="form-label">App Name</label>
            <input type="text" id="app-name" class="form-control" placeholder="Enter app name">
        </div>

        <button class="btn btn-primary w-100" id="generate">Generate Password</button>

        <button class="btn btn-success w-100 mt-2" id="save-password" style="display: none;">Save Password</button>

        <div id="history"></div>
    </div>

    <div class="toast align-items-center text-bg-success" role="alert" id="copyToast" style="display:none;">
        <div class="d-flex">
            <div class="toast-body">Copied to clipboard!</div>
        </div>
    </div>

    <script>
        const lengthEl = document.getElementById('length');
        const uppercaseEl = document.getElementById('uppercase');
        const lowercaseEl = document.getElementById('lowercase');
        const numbersEl = document.getElementById('numbers');
        const symbolsEl = document.getElementById('symbols');
        const passwordEl = document.getElementById('password');
        const generateBtn = document.getElementById('generate');
        const copyBtn = document.getElementById('copy');
        const strengthEl = document.getElementById('strength');
        const toggleBtn = document.getElementById('toggle');
        const toast = document.getElementById('copyToast');
        const saveBtn = document.getElementById('save-password');
        const appNameInput = document.getElementById('app-name');
        const historyEl = document.getElementById('history');
    
        let showPassword = false;
        let passwordHistory = [];
        let generatedPassword = '';
    
        const randomFunc = {
            lowercase: () => String.fromCharCode(Math.floor(Math.random() * 26) + 97),
            uppercase: () => String.fromCharCode(Math.floor(Math.random() * 26) + 65),
            number: () => Math.floor(Math.random() * 10).toString(),
            symbol: () => "!@#$%^&*()_+{}[]<>,.?/".charAt(Math.floor(Math.random() * 25))
        };
    
        function generatePassword() {
            const length = +lengthEl.value;
            const hasUpper = uppercaseEl.checked;
            const hasLower = lowercaseEl.checked;
            const hasNumber = numbersEl.checked;
            const hasSymbol = symbolsEl.checked;
    
            const types = [];
            if (hasLower) types.push('lowercase');
            if (hasUpper) types.push('uppercase');
            if (hasNumber) types.push('number');
            if (hasSymbol) types.push('symbol');
    
            if (types.length === 0) {
                passwordEl.value = '';
                strengthEl.textContent = 'None';
                return;
            }
    
            let password = '';
            for (let i = 0; i < length; i++) {
                const type = types[Math.floor(Math.random() * types.length)];
                password += randomFunc[type]();
            }
    
            passwordEl.value = password;
            generatedPassword = password;
            updateStrength(password);
            updateHistory(password);
            saveBtn.style.display = 'block';  // Show the "Save Password" button
        }
    
        function updateStrength(password) {
    let score = 0;
    if (password.length >= 8) score++;
    if (/[A-Z]/.test(password)) score++;
    if (/[0-9]/.test(password)) score++;
    if (/[^A-Za-z0-9]/.test(password)) score++;
    if (password.length >= 16) score++;  // Extra point for longer passwords

    const strengthLevels = ['Weak', 'Fair', 'Good', 'Strong', 'Very Strong'];
    const strengthClasses = ['weak', 'fair', 'good', 'strong', 'very-strong'];

    // Reset classes
    strengthEl.className = '';
    
    // Set new strength text and class
    strengthEl.textContent = strengthLevels[score - 1] || 'None';
    if (score > 0) {
        strengthEl.classList.add(strengthClasses[score - 1]);
    }
}

    
        function updateHistory(password) {
            passwordHistory.unshift(password);
            historyEl.innerHTML = passwordHistory.slice(0, 5).map(pw => `<div>${pw}</div>`).join('');
        }
    
        copyBtn.addEventListener('click', () => {
            navigator.clipboard.writeText(passwordEl.value).then(() => {
                toast.style.display = 'block';
                setTimeout(() => {
                    toast.style.display = 'none';
                }, 2000);
            });
        });
    
        toggleBtn.addEventListener('click', () => {
            showPassword = !showPassword;
            passwordEl.type = showPassword ? 'text' : 'password';
            toggleBtn.innerHTML = showPassword ?
                `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-eye-slash" viewBox="0 0 16 16">
                    <path d="M11.854 1.646a.5.5 0 0 0-.708 0L9.707 3.207C8.885 2.85 7.951 2.5 7 2.5 4.79 2.5 3 4.79 3 7s1.79 4.5 4 4.5c.764 0 1.477-.244 2.085-.653l1.146 1.146a.5.5 0 0 0 .707-.707l-1.146-1.146a4.487 4.487 0 0 0 .353-2.623c0-1.97-1.635-3.5-3.5-3.5S4.5 5.03 4.5 7s1.635 3.5 3.5 3.5c1.557 0 2.884-.96 3.354-2.354L13.5 10.5l-.707-.707L11.854 1.646z"/>
                </svg>` : 
                `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-eye" viewBox="0 0 16 16">
                    <path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8M1.173 8a13 13 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5s3.879 1.168 5.168 2.457A13 13 0 0 1 14.828 8q-.086.13-.195.288c-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.119 12.5 8 12.5s-3.879-1.168-5.168-2.457A13 13 0 0 1 1.172 8z" />
                    <path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5M4.5 8a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0" />
                </svg>`;
        });
    
        generateBtn.addEventListener('click', generatePassword);
    
        saveBtn.addEventListener('click', () => {
            const appName = appNameInput.value.trim();
            if (appName && generatedPassword) {
                alert(`Password for ${appName} saved!`);
                appNameInput.value = '';
                saveBtn.style.display = 'none';  // Hide "Save Password" button
            } else {
                alert('Please generate a password and enter an app name.');
            }
        });
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch((err) => console.error('SW registration failed', err));
            });
        }
    </script>
</body>

</html>
