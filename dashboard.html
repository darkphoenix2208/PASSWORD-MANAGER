<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Password Manager Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  

  <style>
    body {
      background: linear-gradient(135deg, #2c3e50, #4ca1af);
      color: white;
      font-family: 'Segoe UI', sans-serif;
    }
    .nav-bar {
      padding: 1rem;
      background-color: rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(10px);
    }
    .sidebar {
      background-color: rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(6px);
      padding: 2rem 1rem;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .sidebar-section {
      flex-grow: 1;
    }
    .sidebar-bottom {
      text-align: center;
    }
    .sidebar img {
      border-radius: 50%;
      width: 60px;
      height: 60px;
      object-fit: cover;
      margin-bottom: 0.5rem;
    }
    .password-card {
      background-color: rgba(255, 255, 255, 0.08);
      border: none;
      padding: 1rem;
      border-radius: 1rem;
      margin-bottom: 1rem;
    }
    .modal-content {
      background-color: rgba(0, 0, 0, 0.9);
      color: white;
    }
  </style>
</head>
<body>
  <nav class="d-flex justify-content-between align-items-center nav-bar">
    <h4 class="ms-3">Password Manager</h4>
    <div class="d-flex align-items-center">
      <input type="text" class="form-control me-2" placeholder="Search passwords..." id="searchBar" style="max-width: 300px;">
      <span class="me-4">🔔</span>
    </div>
  </nav>
  <div class="container-fluid">
    <div class="row">
      <!-- Sidebar -->
      <div class="col-md-3 sidebar">
        <div class="sidebar-section">
          <h5>Vault</h5>
          <ul class="list-unstyled">
            <li>🔐 Personal Vault</li>
            <li>📄 Personal Info</li>
            <li>💳 Payments</li>
            <li>🗒 Secure Notes</li>
          </ul>
          <hr>
          <h5>Other Sections</h5>
          <ul class="list-unstyled">
            <li>⭐ Favorites</li>
            <li>♻️ Restored from Xaml</li>
            <li>🏷 Labels</li>
            <li>📆 Created/Modified</li>
          </ul>
          <button class="btn btn-light mt-3 w-100" data-bs-toggle="modal" data-bs-target="#passwordGeneratorModal">🔐 Password Generator</button>
        </div>
        <div class="sidebar-bottom">
          <img id="profile-pic" src="https://via.placeholder.com/80" alt="User" />
          <h6 id="username">Username</h6>
          <p>Items: <span id="password-count">0</span></p>
          <button class="btn btn-outline-light btn-sm my-1">⚙️ Settings</button>
          <button class="btn btn-outline-light btn-sm my-1">📞 Contact Us</button>
          <button class="btn btn-danger btn-sm my-1" onclick="logout()">🚪 Sign Out</button>
        </div>
      </div>

      <!-- Main Content -->
      <div class="col-md-9 mt-4">
        <div class="container">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>Stored Passwords</h2>
            <select class="form-select w-auto" id="perPageSelect">
              <option value="3">Show 3</option>
              <option value="6">Show 6</option>
              <option value="9">Show 9</option>
            </select>
          </div>
          <div class="row" id="password-list"></div>
          <div class="text-center mt-3">
            <button class="btn btn-light btn-sm me-2" onclick="prevPage()">⬅ Previous</button>
            <button class="btn btn-light btn-sm" onclick="nextPage()">Next ➡</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Password Generator Modal -->
  <div class="modal fade" id="passwordGeneratorModal" tabindex="-1" aria-labelledby="passwordGeneratorModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="passwordGeneratorModalLabel">Generate Password</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <input type="text" id="generatedPassword" class="form-control mb-2" readonly />
          <button class="btn btn-secondary mb-3" onclick="generatePassword()">Generate</button>
          <input type="text" id="newAppName" class="form-control mb-2" placeholder="Enter App Name"/>
          <input type="text" id="newUsername" class="form-control mb-2" placeholder="Enter Username"/>
          <button class="btn btn-success" onclick="saveGeneratedPassword()">Save Password</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let allPasswords = [
      { website: "Google", username: "john@gmail.com", password: "●●●●●●●●" },
      { website: "Facebook", username: "johnfb", password: "●●●●●●●●" },
      { website: "GitHub", username: "johnhub", password: "●●●●●●●●" }
    ];
    let currentPage = 1;
    let perPage = 3;

    function renderPasswords() {
      const list = document.getElementById("password-list");
      list.innerHTML = "";
      const start = (currentPage - 1) * perPage;
      const passwordsToShow = allPasswords.slice(start, start + perPage);

      document.getElementById("password-count").innerText = allPasswords.length;

      passwordsToShow.forEach(item => {
        const col = document.createElement("div");
        col.className = "col-md-4";
        col.innerHTML = `
          <div class="password-card">
            <h5>${item.website}</h5>
            <p><strong>User:</strong> ${item.username}</p>
            <p><strong>Pass:</strong> ${item.password}</p>
          </div>
        `;
        list.appendChild(col);
      });
    }

    function generatePassword() {
      const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*";
      let pwd = "";
      for (let i = 0; i < 12; i++) pwd += chars.charAt(Math.floor(Math.random() * chars.length));
      document.getElementById("generatedPassword").value = pwd;
    }

    function saveGeneratedPassword() {
      const app = document.getElementById("newAppName").value;
      const user = document.getElementById("newUsername").value;
      const pwd = document.getElementById("generatedPassword").value;
      if (app && user && pwd) {
        allPasswords.push({ website: app, username: user, password: pwd });
        renderPasswords();
        document.getElementById("newAppName").value = "";
        document.getElementById("newUsername").value = "";
        document.getElementById("generatedPassword").value = "";
        const modal = bootstrap.Modal.getInstance(document.getElementById('passwordGeneratorModal'));
        modal.hide();
      }
    }

    document.getElementById("perPageSelect").addEventListener("change", (e) => {
      perPage = parseInt(e.target.value);
      currentPage = 1;
      renderPasswords();
    });

    function prevPage() {
      if (currentPage > 1) {
        currentPage--;
        renderPasswords();
      }
    }
    function nextPage() {
      if (currentPage * perPage < allPasswords.length) {
        currentPage++;
        renderPasswords();
      }
    }

    const user = JSON.parse(localStorage.getItem("user"));
    if (!user) {
      window.location.href = "login.html";
    } else {
      document.getElementById("username").innerText = user.name;
      const profilePic = document.getElementById("profile-pic");
      if (user.picture && profilePic) profilePic.src = user.picture;
    }

    function logout() {
      localStorage.removeItem("user");
      window.location.href = "login.html";
    }

    renderPasswords();
  </script>
</body>
</html>
