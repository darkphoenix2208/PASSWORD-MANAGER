<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Password Manager Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <style>
    body {
      background: linear-gradient(135deg, #2c3e50, #4ca1af);
      color: white;
      font-family: 'Segoe UI', sans-serif;
    }

    .nav-bar {
      padding: 1rem;
      background-color: rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(10px);
    }

    .sidebar {
      background-color: rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(6px);
      padding: 2rem 1rem;
      height: 100vh;
    }

    .sidebar img {
      border-radius: 50%;
      width: 80px;
      height: 80px;
      object-fit: cover;
      margin-bottom: 1rem;
    }

    .sidebar h5 {
      margin-bottom: 1rem;
    }

    .sidebar .btn {
      width: 100%;
      margin-top: 1rem;
    }

    .password-card {
      background-color: rgba(255, 255, 255, 0.08);
      border: none;
      padding: 1rem;
      border-radius: 1rem;
      margin-bottom: 1rem;
    }

    .modal-content {
      background-color: rgba(0, 0, 0, 0.9);
      color: white;
    }
  </style>
</head>
<body>
  <nav class="d-flex justify-content-between align-items-center nav-bar">
    <h4 class="ms-3">Password Manager</h4>
    <a href="#" onclick="logout()" class="btn text-white me-3">Logout</a>
  </nav>

  <div class="container-fluid">
    <div class="row">
      <!-- Sidebar -->
      <div class="col-md-3 sidebar text-center">
        <img id="profile-pic" src="https://via.placeholder.com/80" alt="User" />
        <h5 id="username">Username</h5>
        <button class="btn btn-light" data-bs-toggle="modal" data-bs-target="#passwordGeneratorModal">
          🔐 Password Generator
        </button>
      </div>

      <!-- Main Content -->
      <div class="col-md-9 mt-4">
        <div class="container">
          <h2>Stored Passwords</h2>
          <p class="text-muted">Here are your saved credentials:</p>
          <div class="row" id="password-list">
            <!-- Password Cards Will Appear Here -->
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Password Generator Modal -->
  <div class="modal fade" id="passwordGeneratorModal" tabindex="-1" aria-labelledby="passwordGeneratorModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-xl">
      <div class="modal-content" style="min-height: 80vh;">
        <div class="modal-header">
          <h5 class="modal-title" id="passwordGeneratorModalLabel">🔐 Password Generator</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body p-0">
          <iframe src="password.html" width="100%" height="100%" style="border: none; min-height: 70vh;"></iframe>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Simulated password entries
    const passwords = [
      { website: "Google", username: "john.doe@gmail.com", password: "●●●●●●●●" },
      { website: "Facebook", username: "johndoe123", password: "●●●●●●●●" },
      { website: "GitHub", username: "johndoe", password: "●●●●●●●●" }
    ];

    const list = document.getElementById("password-list");

    passwords.forEach((item) => {
      const col = document.createElement("div");
      col.className = "col-md-6";
      col.innerHTML = `
        <div class="password-card">
          <h5>${item.website}</h5>
          <p><strong>Username:</strong> ${item.username}</p>
          <p><strong>Password:</strong> ${item.password}</p>
        </div>
      `;
      list.appendChild(col);
    });

    // Load user data
    const user = JSON.parse(localStorage.getItem("user"));
    if (!user) {
      window.location.href = "login.html";
    } else {
      document.getElementById("username").innerText = user.name;
      const profilePic = document.getElementById("profile-pic");
      if (user.picture && profilePic) {
        profilePic.src = user.picture;
      }
    }

    // Logout
    function logout() {
      localStorage.removeItem("user");
      window.location.href = "login.html";
    }
  </script>
</body>
</html>
