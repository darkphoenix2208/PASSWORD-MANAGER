<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Password Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="manifest" href="site.webmanifest" />
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1f1c2c, #928dab);
      color: #fff;
      font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif;
    }
    .card {
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(8px);
      border: none;
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 0 20px rgba(0,0,0,0.3);
      width: 100%;
      max-width: 560px;
    }
    .btn + .btn { margin-left: .5rem; }
    a { text-decoration: none; }
  </style>
</head>
<body>
  <div class="card text-center">
    <h1 class="mb-2">🔐 Password Manager</h1>
    <p class="text-muted mb-4">Frontend demo: login, dashboard, and password generator.</p>
    <div class="d-flex justify-content-center mb-3">
      <a href="login.html" class="btn btn-primary">Go to Login</a>
      <a href="dashboard.html" class="btn btn-outline-light">Dashboard</a>
      <a href="password.html" class="btn btn-success">Password Generator</a>
    </div>
    <p class="mb-0">Demo login: <strong>testuser</strong> / <strong>password123</strong></p>
  </div>
</body>
</html>
